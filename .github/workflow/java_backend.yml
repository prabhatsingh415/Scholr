name: java_backend

on:
  push:
    branches: [ "merge-all2" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      # Change 'backend' to your actual backend folder name
      run: mvn -B package -DskipTests --file JavaService/pom.xml
